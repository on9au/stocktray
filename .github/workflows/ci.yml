# Every push and PR: lint, test and build the installer. On main, release-please keeps a release PR
# open; merging it tags a release, and the installer built from that commit is attached to it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: choco install innosetup --no-progress -y
      - run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe

  release-please:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" *.exe --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
