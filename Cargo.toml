[package]
name = "stocktray"
version = "0.1.1"
edition = "2024"
description = "Windows tray icon showing a live stock price"
authors = ["on9au <151502370+on9au@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
# Also where the app looks for updates.
repository = "https://github.com/on9au/stocktray"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
time = { version = "0.3.55", features = ["formatting", "macros", "serde"] }
toml = "1.1.8"
tray-icon = "0.26.1"
ureq = "3.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Threading"] }
winreg = "0.56.0"

[dev-dependencies]
png = "0.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
